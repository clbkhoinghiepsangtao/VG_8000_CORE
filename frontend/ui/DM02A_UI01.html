<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>DM02A</title>
<style>body{font-family:Arial;background:#f5f7fb;margin:0;padding:18px}.p{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{padding:8px 10px}.primary{background:#1769e0;color:#fff;border:0;border-radius:6px}.bad{color:#b42318}.ok{color:#067647}.scroll{overflow:auto;max-height:58vh}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #ddd;padding:6px;white-space:nowrap}th{background:#f8fafc}</style></head>
<body><div class="p"><h2>DM02A – Mã nghiệp vụ có thời hạn</h2><div>Đổi tuyến: đóng DEN_NGAY dòng cũ rồi tạo dòng mới. Không cho chồng hiệu lực.</div></div>
<div class="p"><div class="row"><button id="dl">Tải mẫu</button><input id="f" type="file" accept=".xlsx"><button id="pv">Kiểm tra file</button><button id="cm" class="primary" disabled>Ghi nhận</button><input id="q" placeholder="Tìm mã"><button id="rl">Tra cứu</button></div><div id="st"></div><div id="pb" class="scroll"></div></div>
<div class="p"><b>Lịch sử mapping</b><div class="scroll"><table><thead><tr><th>MA_NV</th><th>LOAI_MA</th><th>MA_NGHIEP_VU</th><th>HE_THONG</th><th>TU_NGAY</th><th>DEN_NGAY</th><th>TRANG_THAI</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const A="/api/qtgh-stable", $=x=>document.getElementById(x);let file=null,pre=null;
async function J(u,o){const r=await fetch(u,o),t=await r.text();let x;try{x=JSON.parse(t)}catch{x=t}if(!r.ok)throw Error(typeof x==="string"?x:(x.detail||JSON.stringify(x)));return x}
async function L(){const x=await J(A+"/dm02a/list-v112"+($("q").value?"?q="+encodeURIComponent($("q").value):""));$("tb").innerHTML=x.rows.map(r=>`<tr><td>${r.ma_nv}</td><td>${r.loai_ma}</td><td><b>${r.ma_nghiep_vu}</b></td><td>${r.he_thong}</td><td>${r.tu_ngay}</td><td>${r.den_ngay}</td><td>${r.trang_thai}</td></tr>`).join("")}
$("dl").onclick=()=>location.href=A+"/dm02a/template-v112";$("rl").onclick=L;$("f").onchange=e=>{file=e.target.files[0];pre=null;$("cm").disabled=true;$("st").textContent=file?"Đã chọn: "+file.name:""};
$("pv").onclick=async()=>{if(!file)return alert("Chọn file");try{const raw=await file.arrayBuffer();pre=await J(A+"/dm02a/preview-v112?filename="+encodeURIComponent(file.name),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:raw});$("cm").disabled=pre.error_count>0;$("st").innerHTML=`Hợp lệ: <b>${pre.valid_count}</b> · Lỗi/chồng: <b class="${pre.error_count?"bad":"ok"}">${pre.error_count}</b>`;$("pb").innerHTML=`<table><thead><tr><th>Dòng</th><th>MA_NV</th><th>Mã NVụ</th><th>Từ</th><th>Đến</th><th>Lỗi</th></tr></thead><tbody>${pre.rows.map(r=>`<tr><td>${r.row_no}</td><td>${r.ma_nv}</td><td>${r.ma_nghiep_vu}</td><td>${r.tu_ngay}</td><td>${r.den_ngay==="9999-12-31"?"":r.den_ngay}</td><td class="bad">${r.errors.join("; ")}</td></tr>`).join("")}</tbody></table>`}catch(e){$("st").innerHTML=`<span class=bad>${e.message}</span>`}};
$("cm").onclick=async()=>{if(!file||!pre||pre.error_count)return;const raw=await file.arrayBuffer();try{const x=await J(A+"/dm02a/commit-v112?filename="+encodeURIComponent(file.name),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:raw});$("st").innerHTML=`<b class=ok>Đã ghi nhận ${x.committed} dòng</b>`;L()}catch(e){$("st").innerHTML=`<span class=bad>${e.message}</span>`}};L();
</script></body></html>
