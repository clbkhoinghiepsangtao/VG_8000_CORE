<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vĩnh Giang - Quyết toán giao hàng Stable</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{padding:16px}.card{background:#fff;border:1px solid #dfe5ef;border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 5px}h3{margin:0 0 12px}.sub{font-size:12px;color:#667085}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tabs button{height:34px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 11px;cursor:pointer}
.tabs button.active,.primary{background:#1769e0!important;color:#fff!important;border-color:#1769e0!important}
.panel{display:none}.panel.active{display:block}.row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}
input,select,button{height:34px;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;background:#fff}
button{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{border-bottom:1px solid #e6eaf0;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}
.num{width:100px}.danger{color:#b42318}.ok{color:#067647}.section{margin-top:14px}.money{font-variant-numeric:tabular-nums}
</style>
<style id="ba-v11-hide-other-discount">
#other { display:none !important; }
label:has(#other) { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>VĨNH GIANG – QUYẾT TOÁN GIAO HÀNG</h1>
    <div class="sub">Stable Clean V1.1.0 · Luồng UI04 → UI05 → UI06 → UI07 → UI08 → UI09 → UI10 → UI11</div>
    <div class="tabs" id="tabs">
      <button type="button" data-screen="QTGH_UI02" onclick="window.location.href='/ui/QTGH_UI02.html'">UI02 – Chuẩn bị/In/Chốt giao</button>
      <button data-screen="QTGH_UI04" data-id="ui04" class="active">UI04 – Quyết toán tại bàn</button>
      <button data-screen="QTGH_UI05" data-id="ui05">UI05 – Thủ quỹ</button>
      <button data-screen="QTGH_UI06" data-id="ui06">UI06 – Kho nhận trả</button>
      <button data-screen="QTGH_UI07" data-id="ui07">UI07 – Công nợ KH</button>
      <button data-screen="QTGH_UI08" data-id="ui08">UI08 – Thu nợ KH</button>
      <button data-screen="QTGH_UI09" data-id="ui09">UI09 – Nợ NVGH</button>
      <button data-screen="QTGH_UI10" data-id="ui10">UI10 – Điều chỉnh</button>
      <button data-screen="QTGH_UI11" data-id="ui11">UI11 – Kiểm kê quỹ</button>
    </div>
  </div>
  <div id="ui04" class="panel card active"></div>
  <div id="ui05" class="panel card"></div>
  <div id="ui06" class="panel card"></div>
  <div id="ui07" class="panel card"></div>
  <div id="ui08" class="panel card"></div>
  <div id="ui09" class="panel card"></div>
  <div id="ui10" class="panel card"></div>
  <div id="ui11" class="panel card"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=v=>{const n=Number(v||0);return Number.isFinite(n)?Math.round(n).toLocaleString("vi-VN"):"0"};
const parseMoney=v=>Number(String(v??"").replace(/[^\d-]/g,""))||0;
async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{},{"Authorization":"Bearer "+(localStorage.getItem("vg_token")||"")});const r=await fetch(url,opt);let x={};try{x=await r.json()}catch(e){}if(r.status===401)location.href="/login";if(r.status===428)location.href="/change-password";if(!r.ok)throw new Error(x.detail||x.message||("HTTP "+r.status));return x}
function activate(id){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===id))}
document.querySelectorAll("#tabs button[data-id]").forEach(b=>b.onclick=async()=>{activate(b.dataset.id);try{await loaders[b.dataset.id]()}catch(e){$(b.dataset.id).innerHTML='<div class="danger">'+e.message+'</div>'}});


let qtghAccess={},qtghRole="",qtghUsername="";
async function bootstrapQtghAccess(){const p=await api('/api/access/profile');qtghAccess=p.screen_permissions||{};qtghRole=p.role||'';qtghUsername=p.username||'';document.querySelectorAll('#tabs [data-screen]').forEach(b=>b.style.display=(qtghAccess[b.dataset.screen]||'NONE')==='NONE'?'none':'');const a=[...document.querySelectorAll('#tabs button[data-id]')].filter(b=>b.style.display!=='none');if(!a.length){document.querySelector('.wrap').innerHTML='<div class="card danger">Không có quyền QTGH.</div>';return}activate(a[0].dataset.id);await loaders[a[0].dataset.id]();}
let rows04=[],currentDraft=null;

async function loadUI04(){
  const ctx=await api("/api/qtgh-stable/context");
  ui04.innerHTML=`<h3>UI04 – Quyết toán tại bàn & lập phiếu thu</h3>
  <div class="sub">Nhập NVGH để tìm theo nhân viên, hoặc để trống NVGH và nhập chính xác mã đơn nguồn.</div>
  <div class="row section">
    <label>Ngày giao<br><select id="d4"><option value="">-- Tất cả ngày --</option>${(ctx.dates||[]).map(d=>`<option>${d}</option>`).join("")}</select></label>
    <label>NVGH<br><input id="nv4" list="nv4list" placeholder="Gõ 500 → VG0500"><datalist id="nv4list"></datalist></label>
    <label>Lô<br><input id="lo4" list="lo4list" placeholder="Để trống = tất cả lô"><datalist id="lo4list"></datalist></label>
    <label>Tìm đơn<br><input id="q4" placeholder="Nhập mã đơn"></label>
    <button id="search4" class="primary">Tìm kiếm</button>
    <button type="button" onclick="openBankReport()">Mã Ngân Hàng</button>
    <button type="button" onclick="openReductionReport()">chốt giảm trừ cuối đơn</button>
  </div>
  <div id="draft4" class="section"></div><div id="r4" class="section"></div>`;
  nv4.oninput=()=>{clearTimeout(window.nvt);window.nvt=setTimeout(async()=>{const p=new URLSearchParams({q:nv4.value||""});if(d4.value)p.set("ngay_giao",d4.value);const x=await api("/api/qtgh-stable/ui04/suggest-nvgh?"+p);nv4list.innerHTML=(x.rows||[]).map(v=>`<option value="${v}"></option>`).join("")},120)};
  lo4.oninput=()=>{clearTimeout(window.lot);window.lot=setTimeout(async()=>{if(!nv4.value)return;const p=new URLSearchParams({ma_nvgh:nv4.value,q:lo4.value||""});if(d4.value)p.set("ngay_giao",d4.value);const x=await api("/api/qtgh-stable/ui04/suggest-lo?"+p);lo4list.innerHTML=(x.rows||[]).map(v=>`<option value="${v}"></option>`).join("")},120)};
  q4.oninput=render04; search4.onclick=search04;
}
async function search04(){
  const nv=nv4.value.trim(),order=q4.value.trim();
  if(!nv&&!order){alert("Nhập NVGH hoặc mã đơn nguồn chính xác");return}
  const p=new URLSearchParams();
  if(!order&&nv){p.set("ma_nvgh",nv);if(d4.value)p.set("ngay_giao",d4.value);if(lo4.value.trim())p.set("ma_lo",lo4.value.trim())}
  else p.set("ma_don_nguon",order);
  const x=await api("/api/qtgh-stable/ui04/pending-orders?"+p);rows04=x.rows||[];
  if(order&&rows04.length){const staff=[...new Set(rows04.map(r=>r.ma_nvgh).filter(Boolean))];if(staff.length===1)nv4.value=staff[0]}
  render04();
  if(!nv&&!rows04.length)alert("Không có đơn đang chờ quyết toán khớp chính xác mã nguồn này");
}
function render04(){
  const q=(q4?.value||"").trim().toUpperCase();const rows=rows04.filter(r=>!q||String(r.ma_don_nguon||"").toUpperCase().includes(q));
  r4.innerHTML=`<div><b>${rows.length} đơn hiển thị / ${rows04.length} đơn còn chờ quyết toán</b></div>
  <div class="row section"><label><input type="checkbox" id="all4" checked> Chọn tất cả</label><span class="sub">Bỏ chọn = đơn tiếp tục chờ.</span></div>
  <table><thead><tr><th>Chọn</th><th>Đơn</th><th>Ngày</th><th>Lô</th><th>KH MBW</th><th>KH DMS</th><th>Loại</th><th>Trạng thái</th><th>Phải thu</th><th>TM</th><th>CK</th><th>Nợ KH</th><th>Nháp</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><input type="checkbox" class="pick4" data-order="${r.ma_don_nguon}" checked></td><td>${r.ma_don_nguon}</td><td>${r.ngay_giao||r.ngay_don||""}</td><td>${r.ma_lo||""}</td><td>${r.ma_kh_mbw||""}</td><td>${r.ma_kh_dms||""}</td><td>${r.loai_don||""}</td><td>${r.qt_state||""}</td><td>${fmt(r.so_phai_thu)}</td><td>${fmt(r.tien_mat)}</td><td>${fmt(r.tien_ck)}</td><td>${fmt(r.cong_no_kh)}</td><td><button class="open4" data-order="${r.ma_don_nguon}">Mở nháp</button></td></tr>`).join("")}
  </tbody></table><div class="section"><button id="final4" class="primary">Quyết toán đơn đã chọn → Lập 1 phiếu thu</button></div>`;
  all4.onchange=()=>document.querySelectorAll(".pick4").forEach(c=>c.checked=all4.checked);
  document.querySelectorAll(".open4").forEach(b=>b.onclick=()=>openDraft(b.dataset.order));
  final4.onclick=finalize04;
}
async function openDraft(order){currentDraft=await api("/api/qtgh-stable/ui04/open-draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_system:"DMS_MBW",ma_don_nguon:order})});await renderDraft()}
async function bankOpts(selected){const x=await api("/api/qtgh-stable/banks");const rows=Array.isArray(x)?x:(x.rows||[]);return '<option value="">-- Chọn tài khoản --</option>'+rows.map(b=>`<option value="${b.id??b.account_no}" ${String(selected??"")==String(b.id??b.account_no)?"selected":""}>${[b.bank_name,b.account_no,b.account_name].filter(Boolean).join(" - ")}</option>`).join("")}
async function renderDraft(){
  const d=currentDraft,opts=await bankOpts(d.bank_account);
  draft4.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3>Quyết toán nháp – ${d.ma_don_nguon}</h3><button id="closeD">Đóng</button></div>
  <table><thead><tr><th>SKU</th><th>HB đặt</th><th>HB trả</th><th>HB thực giao</th><th>KM đặt</th><th>KM trả</th><th>KM thực giao</th><th>Giá có VAT</th><th>CK/KM gốc</th><th>CK/KM sau QT</th><th>Thành tiền</th></tr></thead><tbody>
  ${(d.lines||[]).map(q=>`<tr><td>${q.ma_sku}</td><td>${q.sl_hang_ban_dat}</td><td><input class="hb num" data-id="${q.id}" value="${q.sl_hang_ban_tra}"></td><td>${q.sl_hang_ban_thuc_giao}</td><td>${q.sl_hang_km_dat}</td><td><input class="km num" data-id="${q.id}" value="${q.sl_hang_km_tra}"></td><td>${q.sl_hang_km_thuc_giao}</td><td>${fmt(q.don_gia_co_vat)}</td><td>${fmt(q.ck_km_dong_goc)}</td><td><input class="ck num" data-id="${q.id}" value="${fmt(q.ck_km_dong_sau)}"></td><td>${fmt(q.thanh_tien_sau)}</td></tr>`).join("")}
  </tbody></table>
  <div class="row section"><label>Tích lũy<br><input id="acc" value="${fmt(d.accumulation_after)}"></label><label>Trưng bày<br><input id="disp" value="${fmt(d.display_after)}"></label></div>
  <div class="row section"><button id="fullBreak">Đơn vỡ 100%</button><button id="saveGoods" class="primary">Lưu & tính lại tiền hàng</button></div>
  <h3 class="section">Thanh toán</h3><div><b>Phải thu sau QT: ${fmt(d.so_phai_thu_sau_qt)}</b></div>
  <div class="row section"><label>Tiền mặt<br><input id="cash" value="${fmt(d.tien_mat)}"></label><label>Chuyển khoản<br><input id="bank" value="${fmt(d.tien_ck_xac_nhan)}"></label><label>Tài khoản nhận<br><select id="ba">${opts}</select></label><label>Mã giao dịch<br><input id="txn" value="${d.bank_txn_id||""}"></label><button id="addBank">+ Tài khoản</button></div>
  <div>Công nợ KH dự kiến: <b id="debtPreview">${fmt(d.cong_no_kh)}</b></div><div id="cashWarning" class="danger" style="display:none;margin-top:6px">Tiền mặt không được lớn hơn số phải thu.</div><div class="section"><button id="cash100">100% tiền mặt</button><button id="bank100">100% chuyển khoản</button><button id="savePay" class="primary">Lưu thanh toán nháp</button></div></div>`;
  closeD.onclick=()=>draft4.innerHTML="";
  const refreshDebtPreview=()=>{
    const due=Number(d.so_phai_thu_sau_qt||0);
    const cashAmt=parseMoney(cash.value);
    const bankAmt=parseMoney(bank.value);
    debtPreview.textContent=fmt(due-cashAmt-bankAmt);
    if(cashAmt>due){
      cashWarning.style.display="block";
      savePay.disabled=true;
    }else{
      cashWarning.style.display="none";
      savePay.disabled=false;
    }
  };
  cash.oninput=refreshDebtPreview;
  bank.oninput=refreshDebtPreview;
  cash100.onclick=()=>{cash.value=fmt(d.so_phai_thu_sau_qt);bank.value="0";refreshDebtPreview()};
  bank100.onclick=()=>{cash.value="0";bank.value=fmt(d.so_phai_thu_sau_qt);refreshDebtPreview()};
  addBank.onclick=async()=>{const bank_name=prompt("Ngân hàng");if(!bank_name)return;const account_no=prompt("Số tài khoản");if(!account_no)return;const account_name=prompt("Chủ tài khoản","CÔNG TY CP VĨNH GIANG")||"";await api("/api/qtgh-stable/banks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bank_name,account_no,account_name})});await renderDraft()};
  fullBreak.onclick=async()=>{if(!confirm("Xác nhận đơn vỡ 100%?"))return;currentDraft=await api(`/api/qtgh-stable/ui04/draft/${d.id}/full-break`,{method:"POST"});await renderDraft();await search04()};
  saveGoods.onclick=()=>saveDraft("recalc");savePay.onclick=()=>saveDraft("payment");
}
function draftPayload(){
  const d=currentDraft;return {lines:(d.lines||[]).map(q=>({id:q.id,sl_hang_ban_tra:document.querySelector(`.hb[data-id="${q.id}"]`).value,sl_hang_km_tra:document.querySelector(`.km[data-id="${q.id}"]`).value,ck_km_dong_sau:parseMoney(document.querySelector(`.ck[data-id="${q.id}"]`).value)})),accumulation_after:parseMoney(acc.value),display_after:parseMoney(disp.value),other_order_discount_after:0,tien_mat:parseMoney(cash.value),tien_ck_xac_nhan:parseMoney(bank.value),bank_account:ba.value,bank_txn_id:txn.value,payment_mode:parseMoney(bank.value)>0?(parseMoney(cash.value)>0?"MIXED":"BANK_100"):"AUTO_CASH"}
}
async function saveDraft(kind){
  const d=currentDraft;
  if(kind==="payment"){
    const due=Number(d.so_phai_thu_sau_qt||0);
    const cashAmt=parseMoney(cash.value);
    const bankAmt=parseMoney(bank.value);
    if(cashAmt>due){
      alert("Tiền mặt không được lớn hơn số phải thu");
      return;
    }
    if(bankAmt>0&&(!ba.value||!txn.value.trim())){
      alert("Có chuyển khoản: bắt buộc chọn tài khoản nhận và mã giao dịch");
      return;
    }
  }
  currentDraft=await api(`/api/qtgh-stable/ui04/draft/${d.id}/${kind}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(draftPayload())});
  await renderDraft();
  await search04();
  alert(kind==="recalc"?"Đã tính lại tiền hàng":"Đã lưu thanh toán nháp");
}
async function finalize04(){const items=[...document.querySelectorAll(".pick4:checked")].map(c=>({source_system:"DMS_MBW",ma_don_nguon:c.dataset.order}));if(!items.length){alert("Chưa chọn đơn");return}if(!confirm(`Quyết toán ${items.length} đơn đã chọn?`))return;const y=await api("/api/qtgh-stable/ui04/finalize-selected",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ma_nvgh:nv4.value.trim(),items})});alert(y.message||"Đã quyết toán");await search04()}

let receipts={};

let ui05Rows=[],ui05StatusFilter="CHO_THU";

function receiptDate5(r){
  const raw=String(r.received_at||r.created_at||r.updated_at||r.ngay_phieu||"").trim();
  if(!raw)return "";
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:"";
}


function isWaiting5(r){
  return String(r.status||"").trim().toUpperCase()==="CHO_THU";
}

function isReceived5(r){
  const st=String(r.status||"").trim().toUpperCase();
  return ["DA_THU_DU","THU_THIEU","DA_THU_THIEU"].includes(st);
}

function renderUI05Rows(){
  const date=$("date5")?.value||"";

  const dateRows=ui05Rows.filter(r=>{
    if(date && receiptDate5(r)!==date)return false;
    return true;
  });

  const waitCount=dateRows.filter(isWaiting5).length;
  const doneCount=dateRows.filter(isReceived5).length;

  if($("wait5"))$("wait5").textContent=`Phiếu Chờ Thu (${waitCount})`;
  if($("done5"))$("done5").textContent=`Phiếu Đã Thu (${doneCount})`;
  if($("all5"))$("all5").textContent=`Tất cả (${dateRows.length})`;

  const rows=dateRows.filter(r=>{
    if(ui05StatusFilter==="CHO_THU")return isWaiting5(r);
    if(ui05StatusFilter==="DA_THU")return isReceived5(r);
    return true;
  });

  const body=$("body5");
  if(!body)return;

  body.innerHTML=rows.map(r=>`<tr>
    <td>${r.receipt_no||r.id}</td>
    <td>${r.receipt_kind||r.source_type||""}</td>
    <td>${r.ma_nvgh||""}</td>
    <td>${fmt(r.expected_amount)}</td>
    <td>${fmt(r.actual_amount)}</td>
    <td>${fmt(r.variance_amount)}</td>
    <td>${r.status||""}</td>
    <td>${isWaiting5(r)
      ?`<button class="take5" data-id="${r.id}">Lập phiếu / Thu tiền</button>`
      :`<button class="print5" data-id="${r.id}">In phiếu</button>`}
    </td>
  </tr>`).join("");

  if(!rows.length){
    body.innerHTML=`<tr><td colspan="8" style="text-align:center;color:#667085;padding:18px">
      Không có phiếu phù hợp bộ lọc.
    </td></tr>`;
  }

  document.querySelectorAll(".take5").forEach(b=>b.onclick=()=>openReceipt(+b.dataset.id));
  document.querySelectorAll(".print5").forEach(b=>b.onclick=()=>printReceipt(+b.dataset.id));

  const count=$("count5");
  if(count)count.textContent=`${rows.length} phiếu hiển thị / ${dateRows.length} phiếu trong ngày lọc`;
}

function setStatus5(status){
  ui05StatusFilter=status;

  ["wait5","done5","all5"].forEach(id=>$(id)?.classList.remove("primary"));

  const active=
    status==="CHO_THU" ? "wait5" :
    status==="DA_THU" ? "done5" : "all5";

  $(active)?.classList.add("primary");
  renderUI05Rows();
}

async function loadUI05(){
  const x=await api("/api/qtgh-stable/ui05/cash");

  ui05Rows=x.rows||[];
  receipts={};
  ui05Rows.forEach(r=>receipts[r.id]=r);

  ui05.innerHTML=`<h3>UI05 – Thủ quỹ</h3>

    <div class="row section">
      <label>Ngày phiếu<br>
        <input type="date" id="date5">
      </label>

      <button id="wait5" class="primary">Phiếu Chờ Thu</button>
      <button id="done5">Phiếu Đã Thu</button>
      <button id="all5">Tất cả</button>
    </div>

    <div id="count5" class="section"></div>
    <div id="edit5" class="section"></div>

    <table>
      <thead><tr>
        <th>Số phiếu</th>
        <th>Loại phiếu</th>
        <th>NVGH</th>
        <th>Phải thu</th>
        <th>Đã thu</th>
        <th>Chênh lệch</th>
        <th>Trạng thái</th>
        <th></th>
      </tr></thead>
      <tbody id="body5"></tbody>
    </table>`;

  date5.onchange=renderUI05Rows;
  wait5.onclick=()=>setStatus5("CHO_THU");
  done5.onclick=()=>setStatus5("DA_THU");
  all5.onclick=()=>setStatus5("ALL");

  renderUI05Rows();
}

  const r=await api(`/api/qtgh-stable/ui06/requests/${id}`);

  u6body.innerHTML=`<div class="card">

async function saveCollect7(idx){
  const g=ui07Groups[idx];
  const cash=parseMoney($(`cash7_${idx}`).value);
  const bank=parseMoney($(`bank7_${idx}`).value);
  const ba=$(`ba7_${idx}`).value;
  const txn=$(`txn7_${idx}`).value.trim();

  if(cash+bank<=0){
    alert("Chưa nhập số tiền thu");

  }

  if(cash+bank>Number(g.total_debt||0)){
    alert("Số tiền thu vượt tổng nợ khách hàng");
    return;
  }

  if(bank>0 && (!ba || !txn)){
    alert("Có chuyển khoản: bắt buộc chọn tài khoản nhận và mã giao dịch");
    return;
  }

  const y=await api("/api/qtgh-stable/ui07/customer-collect",{
    method:"POST",
    headers:{"Content-Type":"application/json"},

      ma_nvgh:nv7.value.trim(),

      cash_amount:cash,
      bank_amount:bank,
      bank_account:ba,
      bank_txn_id:txn

  await searchUI07();

async function openCollect9(id){
  const r=ui09Rows.find(x=>Number(x.id)===id);
  if(!r)return;

  const balance=Number(r.balance??r.con_no??r.so_con_no??r.debt_balance??r.amount_due??0);
  const bx=await api("/api/qtgh-stable/banks");
  const banks=Array.isArray(bx)?bx:(bx.rows||[]);

  edit9.innerHTML=`<div class="card">
    <h3>Thu nợ nhân viên ${r.ma_nvgh||r.ma_nv||""}${r.ten_nv?` - ${r.ten_nv}`:""}</h3>
    <div class="sub">Còn nợ Công ty: <b>${fmt(balance)}</b></div>

    <div class="row section">
      <label>Tiền mặt<br><input id="cash9" value="0"></label>
      <label>Chuyển khoản<br><input id="bank9" value="0"></label>
      <label>Tài khoản nhận<br>
        <select id="ba9">
          <option value="">-- Chọn tài khoản --</option>
          ${banks.map(b=>`<option value="${b.id??b.account_no}">${[b.bank_name,b.account_no,b.account_name].filter(Boolean).join(" - ")}</option>`).join("")}
        </select>
      </label>
      <label>Mã giao dịch<br><input id="txn9"></label>
    </div>

    <div class="section">
      <button id="save9" class="primary">Lưu thu nợ NV</button>
      <button id="close9">Đóng</button>
    </div>
  </div>`;

  close9.onclick=()=>edit9.innerHTML="";

  save9.onclick=async()=>{
    const cash=parseMoney(cash9.value);
    const bank=parseMoney(bank9.value);

    if(cash+bank<=0){
      alert("Chưa nhập số tiền thu nợ");
      return;
    }

    if(cash+bank>balance){
      alert("Tổng số tiền thu vượt số nợ nhân viên");
      return;
    }

    if(bank>0 && (!ba9.value || !txn9.value.trim())){
      alert("Có chuyển khoản: bắt buộc chọn tài khoản nhận và mã giao dịch");
      return;
    }

    const y=await api("/api/qtgh-stable/ui09/collect",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        employee_debt_id:id,
        cash_amount:cash,
        bank_amount:bank,
        bank_account:ba9.value,
        bank_txn_id:txn9.value.trim()
      })
    });

    let msg=`Đã lưu thu nợ NV ${y.ma_nvgh}${y.ten_nv?` - ${y.ten_nv}`:""}.`;
    if(y.cash_receipt_id){
      msg+=` Đã tạo phiếu thu tiền mặt #${y.cash_receipt_id} sang UI05.`;
    }
    if(y.bank_amount>0){
      msg+=` Chuyển khoản ${fmt(y.bank_amount)} đã giảm nợ ngay.`;
    }

    alert(msg);
    edit9.innerHTML="";
    await loadUI09();
  };
}

  if(delta===0){
    alert("Giá trị điều chỉnh phải khác 0");
    return;
  }

  if(!reason10.value.trim()){
    alert("Bắt buộc nhập lý do");
    return;
  }

  const y=await api("/api/qtgh-stable/ui10/adjustment-stable",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      source_doc_type:r.source_doc_type,
      source_doc_id:r.source_doc_id,
      source_ref:r.source_ref,
      ma_nvgh:r.ma_nvgh||"",
      adjustment_type:adjType10.value,
      delta_amount:delta,
      reason:reason10.value.trim(),
      note:note10.value.trim()
    })
  });

  alert(`Đã tạo phiếu ${y.adjustment_no}`);
  edit10.innerHTML="";
  await loadAdjustments10();

const DENOMS11B=[500000,200000,100000,50000,20000,10000,5000,2000,1000,500,200,100];

function todayLocal11B(){
  const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function readDate11B(){
  return $("date11b")?.value||todayLocal11B();
}

function isWait11B(r){
  return String(r.status||"").trim().toUpperCase()==="CHO_THU";
}

function isDone11B(r){
  return ["DA_THU_DU","THU_THIEU","DA_THU_THIEU"].includes(
    String(r.status||"").trim().toUpperCase()
  );
}

function vnWords11B(n){
  n=Math.round(Number(n||0));
  if(n===0)return "Không đồng";
  if(n<0)return "Âm "+vnWords11B(-n).replace(/ đồng$/i,"")+" đồng";

  const d=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
  const u=[""," nghìn"," triệu"," tỷ"," nghìn tỷ"," triệu tỷ"];

  function three(v,full){
    const a=Math.floor(v/100),b=Math.floor((v%100)/10),c=v%10;
    let s="";
    if(a>0||full){
      s+=d[a]+" trăm";
      if(b===0&&c>0)s+=" lẻ";
    }
    if(b>1){
      s+=" "+d[b]+" mươi";
      if(c===1)s+=" mốt";
      else if(c===5)s+=" lăm";
      else if(c>0)s+=" "+d[c];
    }else if(b===1){
      s+=" mười";
      if(c===5)s+=" lăm";
      else if(c>0)s+=" "+d[c];
    }else if(c>0){
      s+=" "+d[c];
    }
    return s.trim();
  }

  let x=n,groups=[];
  while(x>0){groups.push(x%1000);x=Math.floor(x/1000)}
  let parts=[];
  for(let i=groups.length-1;i>=0;i--){
    if(groups[i]===0)continue;
    parts.push(three(groups[i],i<groups.length-1&&groups[i]<100)+u[i]);
  }
  const s=parts.join(" ").replace(/\s+/g," ").trim();
  return s.charAt(0).toUpperCase()+s.slice(1)+" đồng";
}

function savedNote11B(denom){
  const r=(ui11SavedB?.lines||[]).find(x=>Number(x.denomination)===denom);
  return r?Number(r.note_count||0):0;
}

function savedLoose11B(){

}

function calc11B(){
  let total=0;
  DENOMS11B.forEach(d=>{
    const inp=document.querySelector(`.note11b[data-denom="${d}"]`);
    const cnt=inp?Math.max(0,Number(inp.value||0)):savedNote11B(d);
    const amt=d*cnt;
    total+=amt;
    const td=document.querySelector(`.amt11b[data-denom="${d}"]`);
    if(td)td.textContent=fmt(amt);
  });

  const loose=Math.max(0,Math.min(99,Number(document.getElementById("loose11b")?.value??savedLoose11B()??0)));
  total+=loose;
  const received=doneRows11B().reduce((s,r)=>s+Number(r.actual_amount||0),0);
  const variance=total-received;

  if(document.getElementById("looseAmt11b")) looseAmt11b.textContent=fmt(loose);
  counted11b.textContent=fmt(total);
  words11b.textContent=vnWords11B(total);
  variance11b.textContent=fmt(variance);
  variance11b.className=variance===0?"ok":variance<0?"danger":"";
}

<script>
// ===== QTGH UI10 FIX + MONEY HELPER V1 =====
(function(){
  // ----------------------------------------------------------------
  // 1) Fix missing readDate11B helper.
  // Safe generic formatter: returns YYYY-MM-DD when possible.
  // ----------------------------------------------------------------
  if(typeof window.readDate11B !== "function"){
    window.readDate11B = function(v){
      if(v===null || v===undefined || v==="") return "";
      const s=String(v).trim();

      // Already ISO/date-like
      const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

      // dd/mm/yyyy or dd-mm-yyyy
      const vi=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if(vi){
        return `${vi[3]}-${String(vi[2]).padStart(2,"0")}-${String(vi[1]).padStart(2,"0")}`;
      }

      const d=new Date(s);
      if(!Number.isNaN(d.getTime())){
        const y=d.getFullYear();
        const m=String(d.getMonth()+1).padStart(2,"0");
        const day=String(d.getDate()).padStart(2,"0");
        return `${y}-${m}-${day}`;
      }
      return s;
    };
  }

  // ----------------------------------------------------------------
  // 2) Money input helper.
  // Does NOT alter the real input value, so existing calculations
  // continue to receive plain numbers.
  // ----------------------------------------------------------------
  const MONEY_WORDS = [
    "tiền","tien","cash","bank","amount","thu","nộp","nop",
    "chuyển khoản","chuyen khoan","phải thu","phai thu",
    "thực thu","thuc thu","giá trị","gia tri",
    "công nợ","cong no","điều chỉnh","dieu chinh",
    "thanh toán","thanh toan","ck/km","ckkm"
  ];

  function digitsOnly(v){
    let s=String(v??"").trim();
    // Preserve minus sign if user enters negative adjustment.
    const neg=s.startsWith("-");
    s=s.replace(/[^\d]/g,"");
    if(!s) return "";
    return (neg?"-":"")+s;
  }

  function formatMoney(v){
    const raw=digitsOnly(v);
    if(!raw || raw==="-" ) return "";
    const neg=raw.startsWith("-");
    const n=neg?raw.slice(1):raw;
    const out=n.replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return (neg?"-":"")+out;
  }

  function labelText(input){
    const parts=[];
    if(input.id) parts.push(input.id);
    if(input.name) parts.push(input.name);
    if(input.placeholder) parts.push(input.placeholder);

    const label=input.closest("label");
    if(label) parts.push(label.textContent||"");

    const parent=input.parentElement;
    if(parent) parts.push(parent.textContent||"");

    return parts.join(" ").toLowerCase();
  }

  function looksLikeMoneyInput(input){
    if(!(input instanceof HTMLInputElement)) return false;
    if(["checkbox","radio","date","month","file","button","submit"].includes((input.type||"").toLowerCase())) return false;

    const text=labelText(input);
    if(MONEY_WORDS.some(w=>text.includes(w))) return true;

    // Strong id/name keywords
    const key=((input.id||"")+" "+(input.name||"")).toLowerCase();
    return /(cash|bank|amount|money|tien|thu|nop|debt|adjust|payment|ckkm)/.test(key);
  }

  function ensureMoneyPreview(input){
    if(input.dataset.moneyHelperV1==="1") return;
    if(!looksLikeMoneyInput(input)) return;

    input.dataset.moneyHelperV1="1";

    const hint=document.createElement("div");
    hint.className="money-helper-v1";
    hint.style.cssText=[
      "font-size:12px",
      "color:#475467",
      "margin-top:3px",
      "min-height:14px",
      "white-space:nowrap"
    ].join(";");
    input.insertAdjacentElement("afterend",hint);

    function refresh(){
      const f=formatMoney(input.value);
      hint.textContent=f ? `≈ ${f}` : "";
    }

    input.addEventListener("input",refresh);
    input.addEventListener("change",refresh);
    input.addEventListener("blur",refresh);
    refresh();
  }

  function scan(){
    document.querySelectorAll("input").forEach(ensureMoneyPreview);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>setTimeout(scan,100));
  }else{
    setTimeout(scan,100);
  }

  // Dynamic screens/forms in UI04-UI11
  const obs=new MutationObserver(()=>scan());
  obs.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script>
// ===== QTGH PRINT + UI11 DATE FIX V2 =====
(function(){
  let metaV2={staff:{},receipt_numbers:{}};

  async function loadMetaV2(){
    try{
      const r=await fetch("/api/qtgh-stable/print/meta-v2");
      if(r.ok) metaV2=await r.json();
    }catch(e){}
  }

  function todayLocalV2(){
    const d=new Date();
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  const nativeFetchV2=window.fetch.bind(window);
  window.fetch=function(input,init){
    let url=String(input||"");
    if(
      url.includes("/api/qtgh-stable/ui11/day-summary?date=") ||
      url.includes("/api/qtgh-stable/ui11/count?date=")
    ){
      url=url.replace(/([?&]date=)(?=&|$)/,`$1${todayLocalV2()}`);
      input=url;
    }
    return nativeFetchV2(input,init);
  };

  function staffNameV2(code){
    return (metaV2.staff||{})[String(code||"").trim()] || "";
  }

  function receiptNoV2(id){
    const key=String(id||"").replace(/^#/,"").trim();
    return (metaV2.receipt_numbers||{})[key] || "";
  }

  function enhancePrintHtmlV2(html){
    if(typeof html!=="string" || !html) return html;
    let out=html;

    out=out.replace(
      /(<td[^>]*>\s*Số phiếu\s*<\/td>\s*<td[^>]*>)#?(\d+)(<\/td>)/gi,
      (m,a,id,b)=>{
        const no=receiptNoV2(id);
        return a+(no||("#"+id))+b;
      }
    );

    out=out.replace(
      /(<td[^>]*>\s*)NVGH(\s*<\/td>\s*<td[^>]*>)\s*(VG\d+)(\s*<\/td>)/gi,
      (m,a,b,code,c)=>{
        const name=staffNameV2(code);
        return `${a}Người nộp tiền${b}Mã NV: ${code}${name?" - "+name:""}${c}`;
      }
    );

    out=out.replace(
      /(<b[^>]*>\s*)NVGH(\s*:\s*<\/b>\s*)(VG\d+)/gi,
      (m,a,b,code)=>{
        const name=staffNameV2(code);
        return `${a}Mã nhân viên${b}${code}${name?" - "+name:""}`;
      }
    );

    out=out.replace(
      /(NVGH\s*:\s*)(VG\d+)/gi,
      (m,label,code)=>{
        const name=staffNameV2(code);
        return `Mã nhân viên: ${code}${name?" - "+name:""}`;
      }
    );

    out=out.replace(
      /(<[^>]+>\s*)NVGH(\s*<\/[^>]+>\s*(?:<[^>]+>\s*)?\(Ký,\s*ghi rõ họ tên\))/gi,
      `$1Người trả kho$2`
    );

    return out;
  }

  const nativeOpenV2=window.open.bind(window);
  window.open=function(...args){
    const w=nativeOpenV2(...args);
    if(!w) return w;
    try{
      const nativeWrite=w.document.write.bind(w.document);
      w.document.write=function(...parts){
        return nativeWrite(...parts.map(enhancePrintHtmlV2));
      };
      if(w.document.writeln){
        const nativeWriteln=w.document.writeln.bind(w.document);
        w.document.writeln=function(...parts){
          return nativeWriteln(...parts.map(enhancePrintHtmlV2));
        };
      }
    }catch(e){}
    return w;
  };

  function ensureUi11DateV2(){
    document.querySelectorAll('input[type="date"]').forEach(inp=>{
      const area=(inp.closest("section,div")?.textContent||"").toLowerCase();
      if(area.includes("kiểm kê") && !inp.value){
        inp.value=todayLocalV2();
        inp.dispatchEvent(new Event("change",{bubbles:true}));
      }
    });
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",()=>{
      loadMetaV2();
      setTimeout(ensureUi11DateV2,150);
    });
  }else{
    loadMetaV2();
    setTimeout(ensureUi11DateV2,150);
  }
})();
</script>
