<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Đổi mật khẩu</title>
<style id="vg-password-toggle-style">
.vg-pass-wrap{display:flex;gap:6px;align-items:center;width:100%}
.vg-pass-wrap input{flex:1;min-width:0}
.vg-pass-toggle{white-space:nowrap;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#172033;cursor:pointer}
.vg-temp-box{margin-top:10px;padding:12px;border:1px solid #f59e0b;background:#fff7ed;border-radius:9px}
.vg-temp-password{font-size:20px;font-weight:800;letter-spacing:.6px;padding:8px 0;word-break:break-all}
.vg-copy-btn{margin-left:8px}
</style>

<style id="vg-password-toggle-layout-v2">
.vg-pass-wrap{
  display:flex !important;
  align-items:stretch !important;
  gap:6px !important;
  width:100% !important;
}
.vg-pass-wrap input{
  flex:1 1 auto !important;
  width:auto !important;
  min-width:0 !important;
  margin:0 !important;
}
.vg-pass-wrap .vg-pass-toggle{
  flex:0 0 72px !important;
  width:72px !important;
  min-width:72px !important;
  max-width:72px !important;
  margin:0 !important;
  padding:8px 10px !important;
  background:#fff !important;
  color:#172033 !important;
  border:1px solid #cbd5e1 !important;
  border-radius:7px !important;
  cursor:pointer !important;
  font-weight:600 !important;
}
</style>
</head><body style="font-family:Arial;background:#f5f7fb"><div style="max-width:420px;margin:80px auto;background:white;padding:24px;border-radius:12px"><h2>Đổi mật khẩu</h2><input id=oldp type=password placeholder="Mật khẩu hiện tại / mật khẩu tạm" style="width:100%;padding:10px;margin:6px"><input id=newp type=password placeholder="Mật khẩu mới tối thiểu 10 ký tự" style="width:100%;padding:10px;margin:6px"><input id=cf type=password placeholder="Nhập lại mật khẩu mới" style="width:100%;padding:10px;margin:6px"><button onclick=go() style="padding:10px;margin:6px">Đổi mật khẩu</button><div id=msg></div></div><script>const t=localStorage.getItem("vg_token");if(!t)location.href="/login";async function go(){if(newp.value!==cf.value){msg.textContent="Mật khẩu nhập lại không khớp";return}const r=await fetch("/api/auth/change-password",{method:"POST",headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({current_password:oldp.value,new_password:newp.value})});let x={};try{x=await r.json()}catch(e){}if(!r.ok){msg.textContent=x.detail||"Lỗi";return}localStorage.clear();msg.textContent="Đổi mật khẩu thành công";setTimeout(()=>location.href="/login",800)}</script>
<script id="vg-password-toggle-js">
(function(){
  function enhancePasswordInput(input){
    if(!input || input.dataset.vgToggleDone==="1") return;
    input.dataset.vgToggleDone="1";
    const wrap=document.createElement("div");
    wrap.className="vg-pass-wrap";
    input.parentNode.insertBefore(wrap,input);
    wrap.appendChild(input);
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="vg-pass-toggle";
    btn.textContent="Hiện";
    btn.setAttribute("aria-label","Hiện hoặc ẩn mật khẩu");
    btn.onclick=function(){
      const show=input.type==="password";
      input.type=show?"text":"password";
      btn.textContent=show?"Ẩn":"Hiện";
    };
    wrap.appendChild(btn);
  }
  function init(){
    document.querySelectorAll('input[type="password"]').forEach(enhancePasswordInput);
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init);
  }else{
    init();
  }
  window.vgEnhancePasswordInputs=init;
})();
</script>

</body></html>
